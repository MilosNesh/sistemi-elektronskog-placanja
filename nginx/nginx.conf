worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # 1. DEFINIŠEMO GRUPU BACKEND INSTANCI
    upstream psp_servers {
        ip_hash;
        server 127.0.0.1:8446; 
        server 127.0.0.1:8447;
    }

    # 2. HTTPS SERVER (NGINX KOJI SLUŠA FRONTEND)
    server {
        listen       8445 ssl; # Port koji je do sada koristio backend
        server_name  localhost;

        # OVDE MORAŠ DODATI PUTANJE DO SVOJIH SERTIFIKATA
        # Ako ih nemaš, koristi iste one koje koristi tvoj Spring Boot
        ssl_certificate      psp-backend.crt; 
        ssl_certificate_key  psp-backend.key;

        ssl_session_cache    shared:SSL:1m;
        ssl_session_timeout  5m;
        ssl_ciphers  HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers  on;

        location / {
            proxy_pass https://psp_servers;

            # OVO DODAJ - Ključno za SSL handshake
            proxy_ssl_name localhost; 
            
            proxy_ssl_verify off;
            proxy_ssl_server_name on;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;
            proxy_ssl_session_reuse off;

            # Zaglavlja su ti već dobra
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}