apiVersion: apps/v1
kind: Deployment
metadata:
  name: psp-backend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: psp-backend
  template:
    metadata:
      labels:
        app: psp-backend
    spec:
      containers:
      - name: psp-backend-kontejner
        image: psp-backend:5.5
        imagePullPolicy: Never
        ports:
        - containerPort: 8445
        env:
        - name: PSP_SHARED_SECRET
          value: "psp-bank-secret"
        - name: PAYPAL_CLIENT_ID
          value: "AfwHmxRWC1IXO5KOY2ddfB-zqsuTLQMDmdRnzlcH3twm4df88iq2PoSvW4jDDHQNKQsA1IqM8sgg190m"
        - name: PAYPAL_CLIENT_SECRET
          value: "EIJ0GKuL46hTxWEHjrQkgoxGzz3ge18e6DJrsh7DcnI2dOZxjVVQtOxIwWe4qlCrNyS7YnAirx6eJAF3"
        - name: CURRENCY_FREAKS_API_KEY
          value: "b7cdfa36fea8451fafe0d15071a4386e"
        - name: INFURA_PROJECT_ID
          value: "3ea43add55f94bf9bde36a8a36308ea8"
        - name: ETH_TEST_PRIVATE_KEY
          value: "0fb6ce15cadce429e7bd7579dfd393225ceae7a637f1c7bc459eb39022fb8c80"

        volumeMounts:
          - name: logs
            mountPath: /logs
      volumes:
        - name: logs
          emptyDir: {}