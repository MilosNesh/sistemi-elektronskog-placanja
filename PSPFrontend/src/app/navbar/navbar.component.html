<nav class="navbar">
  <div class="nav-logo">PSP System</div>

  <div class="nav-links">
    <a *ngIf="!isLoggedIn"
       routerLink="/login"
       routerLinkActive="active">
       Login
    </a>

    <ng-container *ngIf="isLoggedIn">
      <span class="user-email">{{ authService.getEmail() }}</span>
      <a (click)="onLogout()" class="logout-link">Logout</a>
    </ng-container>
  </div>
</nav>
