<div class="crypto-container">

  <h1>Bitcoin payment</h1>

  <div *ngIf="loading">
    Loading crypto payment...
  </div>

  <div *ngIf="error">
    {{ error }}
  </div>

  <div *ngIf="!loading && !error">

    <p>
      You are paying:
      <strong>{{ amount }} {{ currency }}</strong>
    </p>

    <p>
      Scan the QR code below using a <strong>Bitcoin testnet wallet</strong>
    </p>

    <div class="qr-wrapper">
      <qrcode
        [qrdata]="btcQrData"
        [width]="260"
        [errorCorrectionLevel]="'M'">
      </qrcode>
    </div>

    <div class="details">
      <p><strong>Address:</strong></p>
      <code>{{ btcAddress }}</code>

      <p><strong>Amount:</strong> {{ btcAmount }} BTC</p>
    </div>

    <p class="note">
      BTC amount is calculated in real time based on the current exchange rate.
    </p>

  </div>

</div>
