<div class="payment-config-container">

<div *ngIf="feedbackMessage" class="feedback">
  {{ feedbackMessage }}
</div>

  <div class="payment-methods">
    <div class="payment-card" data-method="CARD">
      <img src="images/credit-card.png" alt="Credit Card" />
      <div class="payment-info">
        <h3>Credit Card</h3>
        <p>Visa, MasterCard</p>
      </div>
      <label class="payment-label">
          <input type="checkbox"
                 [checked]="isMethodEnabled('CREDIT_CARD')"
                 (change)="togglePaymentMethod('CREDIT_CARD', $event)">
        </label>
    </div>

    <div class="payment-card" data-method="QR">
      <img src="images/qrcode.png" alt="QR Code" />
      <div class="payment-info">
        <h3>QR Code</h3>
        <p>Instant payment</p>
      </div>
        <label class="payment-label">
          <input type="checkbox"
                 [checked]="isMethodEnabled('QR_CODE')"
                 (change)="togglePaymentMethod('QR_CODE', $event)">
        </label>
    </div>
  </div>

  <div class="callback-urls">
    <div class="form-group">
      <label for="successUrl">Success URL</label>
      <input type="url" id="successUrl" placeholder="https://merchant.com/success" />
    </div>

    <div class="form-group">
      <label for="failUrl">Fail URL</label>
      <input type="url" id="failUrl" placeholder="https://merchant.com/fail" />
    </div>

    <div class="form-group">
      <label for="errorUrl">Error URL</label>
      <input type="url" id="errorUrl" placeholder="https://merchant.com/error" />
    </div>
  </div>

  <div class="actions">
    <button id="submitBtn" (click)="saveMerchant()">Save merchant options</button>
  </div>
</div>
